<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página com estilo CSS inline">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS Interno</title>
    <style>
        body {
            background-color:#b9cdfd
        }
        h1 {
            color: #1a094f;
            font-size: 100px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        p {
            color: #43199c;
            font-size: 65px;
            font-family: cursive;
        }

        .paragrafo {
            color:#43199c;
        }

    </style>
</head>

<body>

    <h1>CSS Interno</h1>

    <div>
        <p class="paragrafo"> Este é um exemplo de css interno</p>
    </div>

</body>

</html>
